# source_registry_extra_global.yaml
#
# Optional expansion sources beyond the v1.0 default registry.
# Enable selectively to avoid noise/cost. Prefer RSS where available; otherwise scrape press rooms.
#
version: "1.0"
note: "This file is a library of optional sources. Merge into source_registry.yaml as needed."

