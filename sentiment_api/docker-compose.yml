# sentiment_api — local dev stack
# Run from sentiment_api/: docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: sentiment
      POSTGRES_PASSWORD: sentiment
      POSTGRES_DB: sentiment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentiment"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.4
    restart: always
    ports:
      - "8081:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  api:
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SENTIMENT_API_ENV: dev
      DATABASE_URL: postgresql://sentiment:sentiment@postgres:5432/sentiment
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_ROOT: /data/artifacts
      SOURCE_REGISTRY_PATH: /etc/sentiment_api/source_registry.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # CORS: allow frontend origin (set to http://YOUR_SERVER_IP:3000 for remote access)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Optional: use Weaviate for vectors (3072-dim). Default: pgvector
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-pgvector}
      WEAVIATE_URL: http://weaviate:8080
    volumes:
      - ./registry:/etc/sentiment_api:ro
      - artifacts:/data/artifacts
      - logs:/data/logs
      - embedding_cache:/var/lib/sentiment_api
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      weaviate: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8080/v1/health', timeout=5); assert b'status' in r.read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    restart: on-failure
    build: .
    command: ["python", "-c", "import asyncio; from sentiment_api.ingest.worker import run_worker; asyncio.run(run_worker())"]
    environment:
      SENTIMENT_API_ENV: dev
      DATABASE_URL: postgresql://sentiment:sentiment@postgres:5432/sentiment
      REDIS_URL: redis://redis:6379/0
      SOURCE_REGISTRY_PATH: /etc/sentiment_api/source_registry.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-pgvector}
      WEAVIATE_URL: http://weaviate:8080
    volumes:
      - ./registry:/etc/sentiment_api:ro
      - artifacts:/data/artifacts
      - logs:/data/logs
      - embedding_cache:/var/lib/sentiment_api
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      weaviate: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.from_url('redis://redis:6379/0'); r.ping()\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  daemon:
    restart: on-failure
    build: .
    command: ["python", "-c", "import asyncio; from sentiment_api.ingest.daemon import run_daemon; asyncio.run(run_daemon())"]
    environment:
      SENTIMENT_API_ENV: dev
      DATABASE_URL: postgresql://sentiment:sentiment@postgres:5432/sentiment
      REDIS_URL: redis://redis:6379/0
      SOURCE_REGISTRY_PATH: /etc/sentiment_api/source_registry.yaml
    volumes:
      - ./registry:/etc/sentiment_api:ro
      - logs:/data/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.from_url('redis://redis:6379/0'); r.ping()\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    restart: on-failure
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        # For remote access (e.g. http://YOUR_SERVER_IP:3000), set to http://YOUR_SERVER_IP:8080 and rebuild
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: on-failure
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  grafana:
    image: grafana/grafana:11.2.2
    restart: on-failure
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  loki:
    image: grafana/loki:3.1.0
    restart: on-failure
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready 2>/dev/null | grep -q ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  promtail:
    image: grafana/promtail:3.1.0
    restart: on-failure
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    depends_on:
      loki: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9080/ready 2>/dev/null | grep -q ready || true"]
      interval: 10s
      timeout: 5s
      retries: 3

  tempo:
    image: grafana/tempo:2.6.1
    restart: on-failure
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready 2>/dev/null | grep -q ready || true"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redis_data:
  weaviate_data:
  embedding_cache:
  artifacts:
  logs:
  grafana_data:
  loki_data:
