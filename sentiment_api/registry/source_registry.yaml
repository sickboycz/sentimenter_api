# Bundled copy from Docs/sentiment_api_tech_package_v1.1/registry/source_registry.yaml
# Override via SOURCE_REGISTRY_PATH env or volume mount
---
version: "1.0"

defaults:
  enabled: true
  translate_to_en: true
  update_interval_sec: 300
  credibility_tier: reputable_media
  license_class: open
  max_fetch_retries: 3
  request_timeout_sec: 20
  respect_robots_txt: true
  max_article_age_days: 30

packs:
  global_firehose: { enabled: true }
  official_macro:  { enabled: true }
  geopolitics:     { enabled: true }
  sanctions:       { enabled: true }
  conflict_humanitarian: { enabled: true }
  energy_nuclear:  { enabled: true }
  optional_media_rss: { enabled: false }

sources:
  - source_id: gdelt_doc_v2
    name: "GDELT DOC 2.0"
    pack: global_firehose
    type: gdelt
    enabled: true
    respect_robots_txt: false
    base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
    language_hint: auto
    translate_to_en: true
    update_interval_sec: 300
    credibility_tier: dataset
    license_class: open
    regions: ["GLOBAL"]
    topics: ["macro", "geopolitics", "politics", "economy", "energy", "trade", "conflict", "sanctions"]
    query_profiles:
      - profile_id: "macro_global"
        query: "inflation OR CPI OR central bank OR interest rates OR recession OR GDP OR PMI"
      - profile_id: "geopolitics_global"
        query: "sanctions OR ceasefire OR missile OR invasion OR election OR coup OR border OR NATO OR UN Security Council"
      - profile_id: "energy_global"
        query: "oil OR gas OR OPEC OR refinery OR pipeline OR tanker OR LNG OR nuclear"

  - source_id: us_fed_rss
    name: "Federal Reserve Board RSS"
    pack: official_macro
    type: rss
    enabled: true
    respect_robots_txt: false
    feed_url: "https://www.federalreserve.gov/feeds/feeds.htm"
    credibility_tier: official
    license_class: open
    regions: ["US"]
    topics: ["rates", "liquidity", "policy", "macro"]

  - source_id: us_bls_rss
    name: "Bureau of Labor Statistics RSS"
    pack: official_macro
    type: rss
    enabled: true
    respect_robots_txt: false
    feed_url: "https://www.bls.gov/feed/"
    credibility_tier: official
    license_class: open
    regions: ["US"]
    topics: ["inflation", "employment", "macro"]

  - source_id: us_bea_releases
    name: "Bureau of Economic Analysis Releases"
    pack: official_macro
    type: scrape
    enabled: true
    page_url: "https://www.bea.gov/news/current-releases"
    credibility_tier: official
    license_class: open
    regions: ["US"]
    topics: ["gdp", "macro"]
    parser_profile: "generic_newsroom"

  - source_id: us_census_feeds
    name: "US Census Feeds"
    pack: official_macro
    type: scrape
    enabled: true
    page_url: "https://www.census.gov/about/contact-us/feeds.html"
    credibility_tier: official
    license_class: open
    regions: ["US"]
