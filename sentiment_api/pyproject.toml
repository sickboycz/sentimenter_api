[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment_api"
version = "1.0.0"
description = "Global macro + political + geopolitical news impact intelligence (Sentimeter)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
scripts = { sentiment-api = "sentiment_api.cli:main" }
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "feedparser>=6.0.0",
    "trafilatura>=1.6.0",
    "langdetect>=1.0.9",
    "openai>=1.12.0",
    "numpy>=1.24.0",
    "argon2-cffi>=23.1.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentiment_api*"]
