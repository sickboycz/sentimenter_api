# sentiment_api — production override (out-of-Docker DB files)
# Use: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# Data lives in /srv/sentimenter/volumes/ (never inside repo)
# User: sentimenter
# See docs/INSTALLATION_MANUAL.md

x-env-file: &env_file
  env_file:
    - /etc/sentimenter/env

services:
  postgres:
    volumes:
      - /srv/sentimenter/volumes/postgres/data:/var/lib/postgresql/data

  redis:
    volumes:
      - /srv/sentimenter/volumes/redis:/data

  weaviate:
    volumes:
      - /srv/sentimenter/volumes/weaviate:/var/lib/weaviate

  api:
    <<: *env_file
    volumes:
      - ./registry/source_registry.yaml:/etc/sentiment_api/source_registry.yaml:ro
      - /srv/sentimenter/volumes/artifacts:/data/artifacts
      - /srv/sentimenter/volumes/logs:/data/logs
      - /srv/sentimenter/volumes/embedding_cache:/var/lib/sentiment_api

  worker:
    <<: *env_file
    volumes:
      - ./registry/source_registry.yaml:/etc/sentiment_api/source_registry.yaml:ro
      - /srv/sentimenter/volumes/artifacts:/data/artifacts
      - /srv/sentimenter/volumes/logs:/data/logs
      - /srv/sentimenter/volumes/embedding_cache:/var/lib/sentiment_api

  daemon:
    <<: *env_file
    volumes:
      - ./registry/source_registry.yaml:/etc/sentiment_api/source_registry.yaml:ro
      - /srv/sentimenter/volumes/logs:/data/logs

  frontend:
    <<: *env_file

  grafana:
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /srv/sentimenter/volumes/grafana_data:/var/lib/grafana

  loki:
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - /srv/sentimenter/volumes/loki_data:/loki
